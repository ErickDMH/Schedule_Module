name: Publish Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(node -p "require('./packages/typescript/package.json').version")
          NEW=$(echo "$CURRENT" | awk -F. '{print $1"."$2"."$3+1}')
          echo "Bumping $CURRENT → $NEW"
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW\"/" packages/typescript/package.json
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" packages/python/pyproject.toml
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/typescript/package.json packages/python/pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      # ── npm ────────────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm install
        working-directory: packages/typescript

      - name: Publish to npm
        run: npm publish
        working-directory: packages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── PyPI ───────────────────────────────────────────────────────────────
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
        working-directory: packages/python

      - name: Build Python package
        run: python -m build
        working-directory: packages/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/python/dist/
